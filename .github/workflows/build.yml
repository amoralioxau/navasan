name: Build NAVASAN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/navasan.keystore

      - name: Configure Signing and Optimization
        run: |
          cd android/app
          python3 << 'PYEOF'
          with open('build.gradle', 'r') as f:
              content = f.read()

          # 1. Add release signing config
          signing_release = '''
                  release {
                      storeFile file("navasan.keystore")
                      storePassword "Navasan2026"
                      keyAlias "navasan"
                      keyPassword "Navasan2026"
                  }'''

          content = content.replace(
              'signingConfigs {',
              'signingConfigs {' + signing_release,
              1
          )

          # 2. Use release signing
          content = content.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release'
          )

          # 3. Enable ProGuard
          content = content.replace(
              'def enableProguardInReleaseBuilds = false',
              'def enableProguardInReleaseBuilds = true'
          )

          # 4. Enable resource shrink
          content = content.replace(
              'def enableShrinkResourcesInReleaseBuilds = false',
              'def enableShrinkResourcesInReleaseBuilds = true'
          )

          # 5. Filter CPU architectures
          if 'abiFilters' not in content:
              abi_config = '''
              splits {
                  abi {
                      reset()
                      enable true
                      universalApk false
                      include "arm64-v8a", "armeabi-v7a"
                  }
              }
              '''
              content = content.replace(
                  'buildTypes {',
                  abi_config + '\n    buildTypes {',
                  1
              )

          with open('build.gradle', 'w') as f:
              f.write(content)

          print("=== Build.gradle patched ===")
          PYEOF

      - name: Verify Changes
        run: |
          cd android/app
          echo "=== ProGuard: ==="
          grep "enableProguardInReleaseBuilds" build.gradle || echo "not found"
          echo "=== Resource shrink: ==="
          grep "enableShrinkResourcesInReleaseBuilds" build.gradle || echo "not found"
          echo "=== Signing: ==="
          grep "signingConfig signingConfigs" build.gradle

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show APK sizes
        run: |
          echo "=== APK sizes ==="
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: navasan-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
